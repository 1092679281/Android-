name: LaCrosse R6 guarded APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build sources
        uses: actions/checkout@v4
        with:
          path: kit
      - name: Checkout exact mcarplay upstream
        uses: actions/checkout@v4
        with:
          repository: wangxso/mcarplay
          ref: 8e25e0f69ab7a3bec14649542adea6eb22f74f9a
          path: upstream
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK 35 using runner preinstalled command-line tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then SDK_ROOT=/usr/local/lib/android/sdk; fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Integrate and build guarded debug APK
        env:
          R6_UPSTREAM: ${{ github.workspace }}/upstream
          R6_OUTPUT: ${{ runner.temp }}/r6-apk
        run: python3 kit/tools/integrate_and_build_r6.py
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: LaCrosse-R6-debug-apk
          path: ${{ runner.temp }}/r6-apk/
          if-no-files-found: error
          retention-days: 14
