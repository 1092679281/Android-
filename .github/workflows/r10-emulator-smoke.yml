name: R10 Android emulator installation and UI smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/emulator_r10_smoke.sh'
      - '.github/workflows/r10-emulator-smoke.yml'
      - 'tools/integrate_and_build_r10.py'
      - 'README-R10-TEST-ENVIRONMENT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    name: Android 15 emulator APK installation and launch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
      - uses: actions/checkout@v4
        with:
          repository: wangxso/mcarplay
          ref: 8e25e0f69ab7a3bec14649542adea6eb22f74f9a
          path: upstream
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="$ANDROID_HOME"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then SDK_ROOT=/usr/local/lib/android/sdk; fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
      - name: R5-R10 patch integration, JVM regression, lint and APK
        env:
          R7_UPSTREAM: ${{ github.workspace }}/upstream
          R10_OUTPUT: ${{ runner.temp }}/r10-apk
        run: python3 kit/tools/integrate_and_build_r10.py
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install APK and smoke test on Android 15 AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash kit/tools/emulator_r10_smoke.sh "$RUNNER_TEMP/r10-apk/mcarplay-LaCrosse-R10-source60-debug.apk" "$RUNNER_TEMP/r10-emulator-report"
      - name: Upload screenshots, crash log, device info and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LaCrosse-R10-Android15-emulator-smoke-report
          path: ${{ runner.temp }}/r10-emulator-report/
          if-no-files-found: warn
          retention-days: 14
