name: LaCrosse R19 single-owner Bluetooth RFCOMM adversarial tests

on:
  pull_request:
    branches: [feature/r18-buick-bluetooth-identity-snapshot]
    paths:
      - 'tools/integrate_and_build_r19.py'
      - 'src/BluetoothSessionArbiter.kt'
      - 'src/BluetoothSessionArbiterTest.kt'
      - '.github/workflows/build-lacrosse-r19-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
      - uses: actions/checkout@v4
        with:
          repository: wangxso/mcarplay
          ref: 8e25e0f69ab7a3bec14649542adea6eb22f74f9a
          path: upstream
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Python patch scripts
        run: |
          python3 -m py_compile kit/tools/integrate_and_build_r7.py kit/tools/integrate_and_build_r8.py kit/tools/integrate_and_build_r9.py kit/tools/integrate_and_build_r10.py kit/tools/integrate_and_build_r12.py kit/tools/integrate_and_build_r13.py kit/tools/integrate_and_build_r14.py kit/tools/integrate_and_build_r15.py kit/tools/integrate_and_build_r16.py kit/tools/integrate_and_build_r18.py kit/tools/integrate_and_build_r19.py
      - name: Patch, run full JVM tests, lint, formatter and assemble debug APK
        env:
          R7_UPSTREAM: ${{ github.workspace }}/upstream
          R19_OUTPUT: ${{ runner.temp }}/r19-apk
        run: python3 kit/tools/integrate_and_build_r19.py
      - name: Preserve regression test reports even when an adversarial test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LaCrosse-R19-junit-and-lint
          path: |
            upstream/app/build/test-results/testStandardDebugUnitTest/
            upstream/app/build/reports/tests/testStandardDebugUnitTest/
            upstream/app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 10
      - uses: actions/upload-artifact@v4
        with:
          name: LaCrosse-R19-connection-arbiter-debug
          path: ${{ runner.temp }}/r19-apk/
          if-no-files-found: error
          retention-days: 14
