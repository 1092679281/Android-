  emulator-smoke:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: mcarplay-R43-debug-apks-NOT-FOR-RELEASE
          path: apks
      - name: Start API 35 emulator and exercise application startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p emulator-evidence
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$(find "$sdk/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          avdmanager="$(dirname "$sdkmanager")/avdmanager"
          export PATH="$sdk/platform-tools:$sdk/emulator:$PATH"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          echo no | "$avdmanager" create avd -n lacrosse-smoke -k 'system-images;android-35;google_apis;x86_64' --force
          emulator -avd lacrosse-smoke -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect >emulator-evidence/emulator.log 2>&1 &
          trap 'adb logcat -d >emulator-evidence/logcat.txt 2>&1 || true; adb emu kill || true' EXIT
          timeout 240 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
          adb shell input keyevent 82
          apk="$(find apks -name 'app-standard-debug.apk' -print -quit)"
          test -s "$apk"
          adb install -g "$apk"
          adb logcat -c
          adb shell am start -W -n com.mcarplay.app/.MainActivity | tee emulator-evidence/launch.txt
          grep -F 'Status: ok' emulator-evidence/launch.txt
          sleep 5
          adb shell pidof com.mcarplay.app
          adb exec-out screencap -p >emulator-evidence/portrait.png
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          sleep 5
          adb shell pidof com.mcarplay.app
          adb exec-out screencap -p >emulator-evidence/landscape.png
          adb logcat -b crash -d >emulator-evidence/crash.txt
          ! grep -F 'Process: com.mcarplay.app,' emulator-evidence/crash.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcarplay-R43-emulator-smoke-evidence
          path: emulator-evidence/
          if-no-files-found: warn
